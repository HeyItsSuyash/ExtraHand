<!DOCTYPE html>
<html>
<head>
  <title>Automation Agent - Options</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .container { max-width: 600px; margin: auto; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"], input[type="password"] { width: 100%; padding: 8px; box-sizing: border-box; }
    button { padding: 10px 15px; background: #005bbf; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #004493; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Settings</h1>
    <div class="form-group">
      <label for="openaiKey">OpenAI API Key (GPT-4o)</label>
      <input type="password" id="openaiKey" placeholder="sk-..." />
    </div>
    <div class="form-group">
      <label for="groqKey">Groq API Key</label>
      <input type="password" id="groqKey" placeholder="gsk_..." />
    </div>
    <div class="form-group">
      <label for="ollamaUrl">Ollama URL (Local LLM)</label>
      <div style="display: flex; gap: 10px;">
        <input type="text" id="ollamaUrl" placeholder="http://127.0.0.1:11434" value="http://127.0.0.1:11434" />
        <button id="requestOllamaPermBtn">Enable Local Model</button>
      </div>
    </div>
    <div class="form-group">
      <label for="executionContext">Background Execution Context</label>
      <select id="executionContext" style="width: 100%; padding: 8px;">
        <option value="notify">Ask for permission via Notification (Default)</option>
        <option value="background_tab">Run quietly in a background tab</option>
      </select>
    </div>
    <button id="saveBtn">Save Settings</button>
    <p id="status"></p>

    <hr style="margin: 30px 0;">

    <h2>Automation Triggers</h2>
    
    <div style="background: #eef; padding: 10px; border-radius: 5px; margin-bottom: 15px;">
      <label>Magic Fill (Describe rule in plain English)</label>
      <div style="display: flex; gap: 10px; margin-bottom: 5px;">
        <input type="text" id="magicFillInput" placeholder="e.g. When I open github.com, summarize my notifications" style="flex-grow: 1;" />
        <button id="magicFillBtn">Magic Fill</button>
      </div>
      <small style="color: #666;">Uses your default LLM to populate the fields below.</small>
    </div>

    <div class="form-group" style="background: #f1f4fa; padding: 15px; border-radius: 8px;">
      <label>Type</label>
      <select id="triggerType" style="margin-bottom: 10px;">
        <option value="time">Time Interval (Minutes)</option>
        <option value="navigation">Website Open (URL Contains)</option>
        <option value="browser_launch">Browser Launch</option>
        <option value="idle_timeout">Idle Timeout (System Idle)</option>
      </select>
      
      <label>Condition Value</label>
      <input type="text" id="triggerCondition" placeholder="e.g. 60 (for 60 mins) or 'github.com'" style="margin-bottom: 10px;" />
      
      <label>Action Prompt</label>
      <input type="text" id="triggerPrompt" placeholder="e.g. Summarize the unread notifications" style="margin-bottom: 10px;" />
      
      <label>Chain to Workflow (Optional Next Task ID)</label>
      <input type="text" id="nextTaskId" placeholder="trigger_123456" style="margin-bottom: 10px;" />

      <button id="addTriggerBtn">Add Trigger</button>
    </div>

    <h3>Active Triggers</h3>
    <ul id="triggerList" style="list-style-type: none; padding: 0;"></ul>

    <hr style="margin: 30px 0;">
    
    <h2>Cost & Usage Dashboard</h2>
    <div style="background: #eef; padding: 15px; border-radius: 8px;">
      <p style="margin-bottom: 5px;"><strong>Today's Token Usage:</strong></p>
      <ul id="usageList" style="list-style: none; padding: 0; margin: 0; font-family: monospace;">
        <li>Loading...</li>
      </ul>
      <p style="margin-top: 10px; font-size: 12px; color: #555;">Estimates only. Actual billing depends on the provider.</p>
    </div>

    <hr style="margin: 30px 0;">
    
    <h2>Data & Templates</h2>
    <div style="background: #eef; padding: 15px; border-radius: 8px; display: flex; gap: 10px;">
      <button id="exportWorkflowsBtn">Export Workflows (JSON)</button>
      <label for="importWorkflowsBtn" style="cursor: pointer; background: #e0e0e0; padding: 5px 10px; border-radius: 4px; border: 1px solid #ccc;">Import Workflows</label>
      <input type="file" id="importWorkflowsBtn" style="display: none;" accept=".json" />
      <button id="exportAuditBtn" style="margin-left: auto;">Export Audit Log (CSV)</button>
    </div>

  </div>
  <script type="module" src="options.js"></script>
</body>
</html>
